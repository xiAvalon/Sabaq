<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>سباق العقول</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <meta name="theme-color" content="#11172e" />
    <script>
      // Apply the saved theme before the first paint (dark unless the player chose light).
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('sabaq:theme') === 'light') theme = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f5f6fc' : '#11172e');
      })();
    </script>
    <meta name="description" content="سباق العقول: مسابقة معلومات عامة سريعة للأصدقاء. تحدي الثلاثين ثانية، فئات، مواجهات، وغرف أونلاين." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="سباق" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
